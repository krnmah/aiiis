name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_NAME: AI Incident Investigation System
      APP_ENV: ci
      APP_HOST: 127.0.0.1
      APP_PORT: "8000"
      POSTGRES_USER: aiiis
      POSTGRES_PASSWORD: aiiis
      POSTGRES_DB: aiiis
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint
        run: python -m flake8 app tests --ignore=E501,E302,W293,F401

      - name: Test
        run: python -m pytest -q
