name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Load CI environment from secret
        env:
          CI_ENV_FILE: ${{ secrets.CI_ENV_FILE }}
        run: |
          if [ -z "${CI_ENV_FILE}" ]; then
            echo "Missing required repository secret: CI_ENV_FILE"
            exit 1
          fi

          printf "%s" "${CI_ENV_FILE}" > .env.ci

          while IFS= read -r line || [ -n "$line" ]; do
            if [[ -z "$line" || "$line" == \#* ]]; then
              continue
            fi
            echo "$line" >> "$GITHUB_ENV"
          done < .env.ci

      - name: Lint
        run: python -m flake8 app tests --ignore=E501,E302,W293,F401

      - name: Test
        run: python -m pytest -q
